.nf{min-height:calc(100svh - 160px);display:grid;place-items:center;padding:70px 0 90px}

.nf h1 em{color:var(--em)}
.nf p{margin:14px auto 0;max-width:46ch;color:var(--ink-2)}
.nf-path{display:inline-block;margin-top:14px;max-width:100%;padding:5px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:.02em}

.nf-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
.nf-links a{padding:12px 8px;border:1px solid var(--line);border-radius:14px;color:var(--ink-2);font-size:14px;transition:border-color .2s,color .2s}
.nf-links a:hover{border-color:var(--em);color:var(--ink)}
@media (max-width:560px){.nf-links{grid-template-columns:repeat(2,minmax(0,1fr))}}
