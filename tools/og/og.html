.frame{position:absolute;inset:28px;border:1px solid rgba(239,234,223,.12);border-radius:26px}
.corner{position:absolute;width:18px;height:18px;border-color:#3fd6a0;border-style:solid;border-width:0}

.copy{position:absolute;left:84px;top:84px;width:640px}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:22px;letter-spacing:.34em}
.brand svg{width:44px;height:auto}
.tag{margin-top:62px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#3fd6a0}
h1{margin-top:18px;font-weight:400;font-size:66px;line-height:1.02;letter-spacing:-.02em}
h1 em{font-style:italic;color:#3fd6a0}
p{margin-top:24px;font-size:22px;line-height:1.4;color:#bcb8ad;width:640px}
.row{position:absolute;left:84px;bottom:66px;display:flex;gap:12px}
.pill{padding:9px 16px;border:1px solid rgba(239,234,223,.16);border-radius:999px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#efeadf;background:rgba(239,234,223,.04)}
